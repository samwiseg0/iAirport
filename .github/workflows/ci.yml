name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is the current image. macos-15 keeps the macOS 14 minimum honest.
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build bundle
        run: make

      - name: Test
        run: make test

      - name: Smoke test
        run: |
          build/iairport.app/Contents/MacOS/iairport --help
          codesign --verify --deep --strict build/iairport.app

  windows:
    name: windows-latest
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup show
          cargo --version

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Smoke test
        run: .\target\release\iairport.exe --help

      - name: Package
        run: |
          New-Item -ItemType Directory -Path dist\iairport | Out-Null
          Copy-Item target\release\iairport.exe, ..\oui.txt, ..\LICENSE.md dist\iairport\
          Compress-Archive -Path dist\iairport\* -DestinationPath dist\iairport-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: iairport-windows-x64
          path: windows/dist/iairport-windows-x64.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Continue"
          $tag = "${{ github.ref_name }}"
          gh release view $tag --repo "${{ github.repository }}" *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo "${{ github.repository }}" --title $tag --generate-notes --verify-tag
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          gh release upload $tag dist\iairport-windows-x64.zip --repo "${{ github.repository }}" --clobber
          exit $LASTEXITCODE
