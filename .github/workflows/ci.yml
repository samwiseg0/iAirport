name: CI

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-26 is the current image. macos-15 keeps the macOS 14 minimum honest.
        os: [macos-26, macos-15]
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build bundle
        run: make

      - name: Test
        run: make test

      - name: Smoke test
        run: |
          build/iairport.app/Contents/MacOS/iairport --help
          codesign --verify --deep --strict build/iairport.app

  windows:
    name: windows-latest
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          rustup show
          cargo --version

      - name: Build
        run: cargo build --release

      - name: Test
        run: cargo test

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Smoke test
        run: .\target\release\iairport.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: iairport-windows-x64
          path: windows/target/release/iairport.exe
