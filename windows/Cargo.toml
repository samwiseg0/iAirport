[package]
name = "iairport-win"
version = "2.4.0"
edition = "2021"
rust-version = "1.85"
description = "Windows port of the iairport Wi-Fi roam monitor"
license = "MIT"
publish = false

[[bin]]
name = "iairport"
path = "src/main.rs"

[lib]
name = "iairport_win"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.61.2"
features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_WiFi",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_System_EventLog",
    "Win32_System_Console",
    "Win32_System_Registry",
]

[profile.release]
strip = true
lto = true
codegen-units = 1
